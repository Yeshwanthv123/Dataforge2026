name: trace-memory-lab
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/trace.db
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      COOKIE_SECURE: "false"
    volumes:
      - trace-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  trace-data:
